      path_smooth:
        max_iterations: 200
        min_diviation: 4.0
        alpha: 0.2
        w_obstacle: 0.4
        w_voronoi: 0.4
        w_curvature: 0.1
        w_smoothing: 0.2
        min_turning_radius: 1.9
        pub_map: true 
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
